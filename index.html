<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Language Learning</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/learning-path/learning-path.html"></iframe>
  <script>
    const routes = {
  "learning-path": "pages/learning-path/learning-path.html",
  "stories-immersion": "pages/stories-immersion/stories-immersion.html",
  "ai-roleplay": "pages/ai-roleplay/ai-roleplay.html",
  "vocabulary-srs": "pages/vocabulary-srs/vocabulary-srs.html",
  "practice-mistakes": "pages/practice-mistakes/practice-mistakes.html",
  "pronunciation-lab": "pages/pronunciation-lab/pronunciation-lab.html",
  "checkpoints-scores": "pages/checkpoints-scores/checkpoints-scores.html",
  "streaks-analytics": "pages/streaks-analytics/streaks-analytics.html",
  "tutor-and-privacy": "pages/tutor-and-privacy/tutor-and-privacy.html",
  "lesson-runner": "pages/lesson-runner/lesson-runner.html",
  "vocab-card-detail": "pages/vocab-card-detail/vocab-card-detail.html",
  "new-vocab-drawer": "pages/new-vocab-drawer/new-vocab-drawer.html",
  "tutor-share-drawer": "pages/tutor-share-drawer/tutor-share-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'learning-path';
      const target = routes[route] || routes['learning-path'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
